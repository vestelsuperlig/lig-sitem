body{

header{

header .cup{font-size:48px;height:55px}
header .cup img{width:55px;height:55px;object-fit:contain}
header h1{margin:5px 0;font-size:28px}
header p{margin:5px;color:#aebbd0}

nav{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px;
  background:#182235

nav button{
  border:0;
  padding:11px 15px;
  border-radius:9px;

  color:white;
  font-weight:bold;

nav button.active{background:#426bd3}

h2{margin:8px 0 20px}

.week{
  margin-bottom:25px;

.week-title{

  padding:14px;
  font-size:18px;
  font-weight:bold

.match{

  gap:8px;
  padding:16px 12px;
  background:#1c273b;
  border-top:1px solid #303d53

.home{text-align:right}
.team{font-weight:bold;font-size:14px}
.score{text-align:center;font-weight:bold}
.pending{font-size:11px;color:#77859d}

.table-box{
  overflow-x:auto;
  border-radius:12px;
  background:#1c273b

table{
    width:610px;
    min-width:610px;
    border-collapse:collapse;
    table-layout:fixed;

#penaltiesList table{

  table-layout:fixed;
}

#penaltiesList th:nth-child(1),
#penaltiesList td:nth-child(1){width:40%}

#penaltiesList th:nth-child(2),
#penaltiesList td:nth-child(2){width:25%}

#penaltiesList th:nth-child(3),
#penaltiesList td:nth-child(3){width:35%}

th:nth-child(2),td:nth-child(2){width:150px}
th:nth-child(3),td:nth-child(3){width:45px}
th:nth-child(4),td:nth-child(4){width:45px}
th:nth-child(5),td:nth-child(5){width:45px}
th:nth-child(6),td:nth-child(6){width:45px}

th:nth-child(9),td:nth-child(9){width:60px}

th{background:#293852;color:#b8c4d8;font-size:11px}
td:nth-child(2){

.card{

footer{

/* 12-22. HAFTALAR: EV/DEPLASMAN TERS */

firstRound.forEach((week,index)=>{
  week.forEach(m=>{

/* PUAN DURUMU */

function calculate(){

  let table={};

  teams.forEach(t=>{
    table[t]={
      name:t,
      o:0,g:0,b:0,m:0,
      ag:0,yg:0,p:0
    };
  });

  matches.forEach(x=>{

    if(x.hs===null || x.as===null)return;

    let h=table[x.home];
    let a=table[x.away];

    h.o++;
    a.o++;

    h.ag+=x.hs;
    h.yg+=x.as;

    a.ag+=x.as;
    a.yg+=x.hs;

    if(x.hs>x.as){
      h.g++;
      a.m++;
      h.p+=3;
    }
    else if(x.hs<x.as){
      a.g++;
      h.m++;
      a.p+=3;
    }
    else{
      h.b++;
      a.b++;
      h.p++;
      a.p++;
    }
  });

  return Object.values(table).sort((a,b)=>{

    let avA=a.ag-a.yg;
    let avB=b.ag-b.yg;

    return b.p-a.p ||
           avB-avA ||
           b.ag-a.ag;

  });
}

/* PUAN TABLOSU */

function renderTable(){

      <td>${x.ag-x.yg>0?"+":""}${x.ag-x.yg}</td>
      <td class="points">${x.p}</td>
    </tr>

  `).join("");
}

}

}

function renderResults(){

  function renderScorers() {
